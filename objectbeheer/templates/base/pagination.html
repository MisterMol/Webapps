{% if page_obj and page_obj.has_other_pages %}
    <nav class="pagination" aria-label="Paginering">
        {% if page_obj.has_previous %}
            <a class="button secondary" href="?page={{ page_obj.previous_page_number }}{% if search_query %}&q={{ search_query|urlencode }}{% endif %}{% if selected_type %}&type={{ selected_type|urlencode }}{% endif %}{% if selected_category %}&categorie={{ selected_category|urlencode }}{% endif %}{% if selected_label %}&label={{ selected_label|urlencode }}{% endif %}{% if selected_availability %}&beschikbaarheid={{ selected_availability|urlencode }}{% endif %}">
                Vorige
            </a>
        {% endif %}

        <span class="pagination-current">
            Pagina {{ page_obj.number }} van {{ page_obj.paginator.num_pages }}
        </span>

        {% if page_obj.has_next %}
            <a class="button secondary" href="?page={{ page_obj.next_page_number }}{% if search_query %}&q={{ search_query|urlencode }}{% endif %}{% if selected_type %}&type={{ selected_type|urlencode }}{% endif %}{% if selected_category %}&categorie={{ selected_category|urlencode }}{% endif %}{% if selected_label %}&label={{ selected_label|urlencode }}{% endif %}{% if selected_availability %}&beschikbaarheid={{ selected_availability|urlencode }}{% endif %}">
                Volgende
            </a>
        {% endif %}
    </nav>
{% endif %}
