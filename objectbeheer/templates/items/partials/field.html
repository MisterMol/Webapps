<div class="form-row">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if field.help_text %}
            <span class="help-icon" tabindex="0">?</span>
        {% endif %}
    </label>

    {{ field }}

    {% if field.help_text %}
        <p class="field-help">{{ field.help_text }}</p>
    {% endif %}

    {% if field.errors %}
        <div class="message">{{ field.errors }}</div>
    {% endif %}
</div>
